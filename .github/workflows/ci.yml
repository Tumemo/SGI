name: SGI CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, mysqli, pdo_mysql
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar manifesto
        run: composer validate --no-check-publish

      - name: Testes unitários
        run: composer test

      - name: Lint PHP
        run: composer lint

      - name: PHPStan
        run: composer analyse

      - name: Verificar estilo PHP
        run: composer cs:check

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sgi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, curl, mysqli, pdo_mysql
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Iniciar servidor PHP isolado
        env:
          SGI_DB_HOST: 127.0.0.1
          SGI_DB_PORT: 3306
          SGI_DB_NAME: sgi_test
          SGI_DB_USER: root
          SGI_DB_PASSWORD: root
          SGI_UPLOAD_DIR: ${{ github.workspace }}/test-results/uploads
          SGI_REGULAMENTOS_DIR: ${{ github.workspace }}/test-results/uploads/regulamentos
          SGI_FOTOS_DIR: ${{ github.workspace }}/test-results/uploads/fotos
          SGI_APP_ENV: test
        run: |
          mkdir -p "$SGI_UPLOAD_DIR" "$SGI_REGULAMENTOS_DIR" "$SGI_FOTOS_DIR"
          nohup php -S 127.0.0.1:8099 -t public public/index.php > /tmp/sgi-test-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8099/index.php > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Suíte HTTP e offline
        env:
          SGI_TEST_BASE_URL: http://127.0.0.1:8099
          SGI_TEST_DB_NAME: sgi_test
          SGI_MYSQL_BIN: mysql
          SGI_DB_HOST: 127.0.0.1
          SGI_DB_PORT: 3306
          SGI_DB_NAME: sgi_test
          SGI_DB_USER: root
          SGI_DB_PASSWORD: root
          SGI_UPLOAD_DIR: ${{ github.workspace }}/test-results/uploads
          SGI_APP_ENV: test
        run: php tests/run_all.php

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Instalar dependências do navegador
        run: npm ci --prefix tests/browser

      - name: Instalar Chromium do Playwright
        run: npx --prefix tests/browser playwright install --with-deps chromium

      - name: Testes de navegador
        env:
          SGI_BASE_URL: http://127.0.0.1:8099/
          SGI_E2E_RESET: '1'
          SGI_PHP_PATH: php
          SGI_TEST_BASE_URL: http://127.0.0.1:8099
          SGI_TEST_DB_NAME: sgi_test
          SGI_MYSQL_BIN: mysql
          SGI_DB_HOST: 127.0.0.1
          SGI_DB_PORT: 3306
          SGI_DB_NAME: sgi_test
          SGI_DB_USER: root
          SGI_DB_PASSWORD: root
          SGI_UPLOAD_DIR: ${{ github.workspace }}/test-results/uploads
          SGI_APP_ENV: test
        run: npm --prefix tests/browser test

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat /tmp/sgi-test-server.log
